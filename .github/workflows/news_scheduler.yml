name: Autonomous News Scheduler

on:
  schedule:
    # Approximate: GitHub cron is not guaranteed to the minute and can be delayed.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-news-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets are present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          missing=0
          for name in GEMINI_API_KEY SERPER_API_KEY SENDER_EMAIL SENDER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            else
              echo "Secret present: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create the missing repository secrets, then re-run this workflow."
            exit 1
          fi

      - name: Run autonomous news pipeline once
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPER_API_KEY_2: ${{ secrets.SERPER_API_KEY_2 }}
          SERPER_API_KEY_3: ${{ secrets.SERPER_API_KEY_3 }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          AUTOMATION_EMAIL: ${{ secrets.AUTOMATION_EMAIL }}
          NEWS_TOPICS: ${{ vars.NEWS_TOPICS }}
          NEWS_LANGUAGE: ${{ vars.NEWS_LANGUAGE }}
          NEWS_FREQUENCY: ${{ vars.NEWS_FREQUENCY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Executing python run_automation.py"
          python run_automation.py

      - name: Persist memory and key-rotation state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news_memory.json api_key_index.json automation_state.json
          if git diff --cached --quiet; then
            echo "No state file changes to persist."
            exit 0
          fi
          git commit -m "chore: persist news memory and automation state"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
